<svg id="routing-svg" viewBox="0 0 2280 870" width="2280" height="870" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" class="arr-fill" />
    </marker>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="teeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b61ff" />
      <stop offset="1" stop-color="#5d30f7" />
    </linearGradient>
    <style>
      .surf { fill: #f7f8fb; stroke: #dfe2ea; }
      .label { fill: #1f2430; }
      .label2 { fill: #8b90a3; }
      .chip { fill: #eef0f8; }
      .chipt { fill: #5d30f7; }
      .strong { fill: #1f2430; }
      .flow { stroke: #b7bcd9; }
      .arr-fill { fill: #b7bcd9; }
      .relay-surf { fill: #fff8ec; stroke: #e8c98a; }
      .relay-text { fill: #8a6412; }
      .soon-surf { fill: #fbfbfd; stroke: #e4e7ef; }
      .soon-text { fill: #9aa0b4; }
    </style>
  </defs>
  <rect x="0" y="0" width="2280" height="870" fill="#ffffff" />
  <g transform="translate(0,-34) scale(3)">

  <!-- 1. 客户端 -->
  <rect x="10" y="132" width="128" height="68" rx="11" class="surf" stroke-width="1" />
  <text x="74" y="154" text-anchor="middle" font-size="11.5" class="label" font-family="system-ui,sans-serif" font-weight="600">User API Client</text>
  <rect x="22" y="164" width="104" height="16" rx="4" class="chip" />
  <text x="74" y="175.5" text-anchor="middle" font-size="9" class="chipt" font-family="monospace">Encrypted prompt</text>
  <text x="74" y="192" text-anchor="middle" font-size="8.5" class="label2" font-family="monospace">&#8595; TLS &#8595;</text>

  <line x1="138" y1="166" x2="206" y2="166" class="flow" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arr)">
    <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1.2s" repeatCount="indefinite" />
  </line>

  <!-- 2. TEE 边界：只圈住网关本身 -->
  <rect x="208" y="104" width="196" height="128" rx="16" fill="url(#teeGrad)" opacity="0.06" stroke="#7b61ff" stroke-width="1.3" stroke-dasharray="6,5">
    <animate attributeName="stroke-dashoffset" from="0" to="-22" dur="3s" repeatCount="indefinite" />
  </rect>
  <text x="306" y="122" text-anchor="middle" font-size="10.5" class="chipt" font-family="system-ui,sans-serif" font-weight="700">&#128274; Intel TDX Confidential VM (TEE)</text>
  <text x="306" y="135" text-anchor="middle" font-size="8.5" class="label2" font-family="system-ui">Hardware-isolated &#183; memory encrypted</text>

  <rect x="224" y="146" width="164" height="72" rx="14" fill="url(#teeGrad)" filter="url(#glow)" />
  <text x="306" y="166" text-anchor="middle" font-size="12.5" fill="white" font-weight="700" font-family="system-ui,sans-serif">TDX Secure Gateway</text>
  <!-- 组件名与产品主页那张图保持一致：这里写的必须是 TEE 里真正在跑的东西，
       而不是历史上某一版的入口组件。 -->
  <text x="306" y="177" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.8)" font-family="system-ui">dstack-ingress + ApexOne</text>
  <rect x="242" y="184" width="128" height="28" rx="8" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.35)" stroke-width="1" />
  <circle cx="258" cy="198" r="4.5" fill="#7CE3B5"><animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite" /></circle>
  <text x="310" y="195" text-anchor="middle" font-size="8" fill="white" font-weight="600" font-family="system-ui">Verified by</text>
  <text x="310" y="205" text-anchor="middle" font-size="8" fill="white" font-weight="600" font-family="system-ui">Remote Attestation</text>

  <!-- 三条供货通道 -->
  <text x="452" y="70" text-anchor="middle" font-size="10" class="label2" font-family="system-ui" font-weight="600">Three supply routes</text>

  <!-- A. 自营 -->
  <path d="M404,158 C428,158 432,104 456,104" class="flow" stroke-width="1.3" fill="none" marker-end="url(#arr)" />
  <rect x="458" y="84" width="126" height="40" rx="9" class="surf" stroke-width="1" />
  <text x="521" y="100" text-anchor="middle" font-size="9.5" class="strong" font-family="system-ui,sans-serif" font-weight="600">Platform-owned</text>
  <text x="521" y="114" text-anchor="middle" font-size="8" class="label2" font-family="system-ui">sealed in TEE</text>

  <!-- B. 共享订阅 -->
  <path d="M404,168 L456,168" class="flow" stroke-width="1.3" fill="none" marker-end="url(#arr)" />
  <rect x="458" y="148" width="126" height="40" rx="9" class="surf" stroke-width="1" />
  <text x="521" y="164" text-anchor="middle" font-size="9.5" class="strong" font-family="system-ui,sans-serif" font-weight="600">Shared subscription</text>
  <text x="521" y="178" text-anchor="middle" font-size="8" class="label2" font-family="system-ui">quota only &#183; sealed in TEE</text>

  <!-- C. 中转：视觉上就要看得出它在密封之外 -->
  <path d="M404,178 C428,178 432,232 456,232" class="flow" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" />
  <rect x="458" y="212" width="126" height="40" rx="9" class="relay-surf" stroke-width="1" stroke-dasharray="4,3" />
  <text x="521" y="228" text-anchor="middle" font-size="9.5" class="relay-text" font-family="system-ui,sans-serif" font-weight="600">Provider API relay</text>
  <text x="521" y="242" text-anchor="middle" font-size="8" class="relay-text" font-family="system-ui">outside the TEE seal</text>

  <!-- 上游：三家都画，但**视觉分级**——已接入的实心，路线图上的淡化加 Soon。
       画成等价会让人以为三家都能用，而文档正文写的是"目前 Claude，其余陆续上线"。 -->
  <line x1="584" y1="104" x2="612" y2="150" class="flow" stroke-width="1.2" marker-end="url(#arr)" />
  <line x1="584" y1="168" x2="612" y2="160" class="flow" stroke-width="1.2" marker-end="url(#arr)" />
  <line x1="584" y1="232" x2="612" y2="172" class="flow" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)" />

  <!-- Claude：唯一已接入 -->
  <rect x="614" y="140" width="104" height="42" rx="10" class="surf" stroke-width="1" />
  <circle cx="634" cy="161" r="8.5" fill="#d97757" />
  <text x="634" y="164.5" text-anchor="middle" font-size="8.5" fill="white" font-family="system-ui" font-weight="700">C</text>
  <text x="672" y="157" text-anchor="middle" font-size="9.5" class="strong" font-family="system-ui,sans-serif" font-weight="600">Claude</text>
  <text x="672" y="169" text-anchor="middle" font-size="7.5" class="label2" font-family="system-ui">Anthropic &#183; live</text>

  <!-- OpenAI / Gemini：路线图 -->
  <rect x="614" y="188" width="104" height="34" rx="10" class="soon-surf" stroke-width="1" stroke-dasharray="4,3" />
  <circle cx="634" cy="205" r="7" fill="#10a37f" opacity="0.45" />
  <text x="676" y="203" text-anchor="middle" font-size="8.5" class="soon-text" font-family="system-ui,sans-serif" font-weight="600">OpenAI</text>
  <text x="676" y="213" text-anchor="middle" font-size="7" class="soon-text" font-family="system-ui">coming soon</text>

  <rect x="614" y="228" width="104" height="34" rx="10" class="soon-surf" stroke-width="1" stroke-dasharray="4,3" />
  <circle cx="634" cy="245" r="7" fill="#4285F4" opacity="0.45" />
  <text x="676" y="243" text-anchor="middle" font-size="8.5" class="soon-text" font-family="system-ui,sans-serif" font-weight="600">Gemini</text>
  <text x="676" y="253" text-anchor="middle" font-size="7" class="soon-text" font-family="system-ui">coming soon</text>

  </g>
</svg>
